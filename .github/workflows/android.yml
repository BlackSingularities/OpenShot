name: Build & Release APK

# Budowanie i wydanie wyłącznie po wypchnięciu tagu wersji (np. v1.2.3).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Wersja
        id: ver
        run: |
          BASE="${GITHUB_REF_NAME#v}"
          NAME="$BASE"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Klucz podpisu
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Budowanie APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: gradle assembleRelease -PversionCode=${{ steps.ver.outputs.code }} -PversionName=${{ steps.ver.outputs.name }} --stacktrace

      - name: Przygotowanie pliku
        run: cp app/build/outputs/apk/release/app-release.apk "OpenShot-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: OpenShot-${{ steps.ver.outputs.name }}
          path: OpenShot-${{ steps.ver.outputs.name }}.apk

      - name: Publikacja wydania
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.name }}"
          NOTES=$(awk -v version="${{ steps.ver.outputs.name }}" '$0 == "## " version { found=1; next } found && /^## / { exit } found { print }' CHANGELOG.md)
          gh release create "$TAG" "OpenShot-${{ steps.ver.outputs.name }}.apk" \
            --target "$GITHUB_SHA" \
            --title "OpenShot ${{ steps.ver.outputs.name }}" \
            --notes "$(printf '%s\n\n---\nPobierz plik **OpenShot-%s.apk** poniżej i zainstaluj go na telefonie (Android 10+).' "$NOTES" "${{ steps.ver.outputs.name }}")" \
            --latest
